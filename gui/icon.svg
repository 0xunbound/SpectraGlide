<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182032"/>
      <stop offset="50%" stop-color="#0c101a"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>

    <!-- Outer Rim Highlight -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.45)"/>
      <stop offset="35%" stop-color="rgba(0, 242, 254, 0.3)"/>
      <stop offset="70%" stop-color="rgba(157, 78, 221, 0.2)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)"/>
    </linearGradient>

    <!-- Core Crystal Glow -->
    <linearGradient id="prismGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="prismGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f076"/>
      <stop offset="100%" stop-color="#00c9ff"/>
    </linearGradient>

    <linearGradient id="prismGrad3" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9d4edd"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="ambient" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Icon -->
  <circle cx="256" cy="256" r="160" fill="#00f2fe" opacity="0.18" filter="url(#ambient)"/>
  <circle cx="256" cy="256" r="120" fill="#9d4edd" opacity="0.14" filter="url(#ambient)"/>

  <!-- Apple Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#bgGrad)"/>
  <rect x="33" y="33" width="446" height="446" rx="103" ry="103" fill="none" stroke="url(#rimGrad)" stroke-width="2.5"/>

  <!-- Inner Shading Rings -->
  <rect x="44" y="44" width="424" height="424" rx="92" ry="92" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1.5"/>

  <!-- Central Quantum Prism Emblem -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Shield / Core Geometries -->
    <!-- Top-Left Facet -->
    <path d="M 0 -130 L 110 -40 L 0 30 L -110 -40 Z" fill="url(#prismGrad1)" opacity="0.9"/>
    
    <!-- Bottom-Left Facet -->
    <path d="M -110 -40 L 0 30 L 0 140 L -90 60 Z" fill="url(#prismGrad2)" opacity="0.85"/>
    
    <!-- Bottom-Right Facet -->
    <path d="M 110 -40 L 0 30 L 0 140 L 90 60 Z" fill="url(#prismGrad3)" opacity="0.85"/>

    <!-- Dynamic Central Energy Spark -->
    <circle cx="0" cy="30" r="18" fill="#ffffff" opacity="0.95"/>
    <circle cx="0" cy="30" r="32" fill="#00f2fe" opacity="0.5" filter="url(#glow)"/>

    <!-- Orbital Trajectory Line -->
    <path d="M -140 20 C -120 -80, 120 -80, 140 20" fill="none" stroke="rgba(255, 255, 255, 0.5)" stroke-width="3" stroke-dasharray="6 8"/>
    <path d="M -140 20 C -120 120, 120 120, 140 20" fill="none" stroke="rgba(0, 240, 118, 0.6)" stroke-width="2.5"/>
    
    <!-- Little Satellite Node -->
    <circle cx="120" cy="-30" r="7" fill="#00f076"/>
    <circle cx="-100" cy="70" r="5" fill="#00f2fe"/>
  </g>
</svg>
